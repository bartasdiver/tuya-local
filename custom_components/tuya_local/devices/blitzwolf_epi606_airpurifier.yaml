name: Air purifier
products:
  - id: 0kp8wo2xazyhqyqm
    manufacturer: BlitzWolf
    model: EPI606
entities:
  - entity: fan
    translation_key: air_purifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: string
        name: preset_mode
        mapping:
          - dps_val: manual
            value: manual
          - dps_val: auto
            value: auto
          - dps_val: sleep
            value: sleep
      - id: 4
        type: string
        name: speed
        mapping:
          - dps_val: "1"
            value: 33
          - dps_val: "2"
            value: 67
          - dps_val: "3"
            value: 100
  - entity: sensor
    class: pm25
    dps:
      - id: 2
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    class: volatile_organic_compounds
    dps:
      - id: 14
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
        mapping:
          - scale: 0.1
  - entity: sensor
    translation_key: air_quality
    class: enum
    dps:
      - id: 22
        type: string
        name: sensor
        mapping:
          - dps_val: "1"
            value: good
          - dps_val: "2"
            value: moderate
          - dps_val: "3"
            value: poor
  - entity: switch
    translation_key: ionizer
    category: config
    dps:
      - id: 6
        type: boolean
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: sensor
    name: Filter remaining
    category: diagnostic
    class: duration
    dps:
      - id: 16
        type: integer
        name: sensor
        unit: h
  - entity: button
    translation_key: filter_reset
    category: diagnostic
    dps:
      - id: 11
        type: boolean
        name: button
        optional: true
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancle
            value: cancel
          - dps_val: "1"
            value: "1h"
          - dps_val: "2"
            value: "2h"
          - dps_val: "3"
            value: "3h"
          - dps_val: "4"
            value: "4h"
  - entity: sensor
    translation_key: time_remaining
    category: diagnostic
    class: duration
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: min
